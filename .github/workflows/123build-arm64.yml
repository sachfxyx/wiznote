name: Build ikiwicc wiznote arm64
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点击触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup QEMU multiarch
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux/arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ikiwicc/wiznote:arm64

      - name: Export image to tar.gz
        run: |
          docker save ikiwicc/wiznote:arm64 | gzip > wiznote-ikiwicc-arm64.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiznote-ikiwicc-arm64
          path: wiznote-ikiwicc-arm64.tar.gz
