name: Build Wiznote arm64 Image & Export Tar
on:
  push:
    branches: [ main ]
  workflow_dispatch: # ✅ 支持手动点击运行（推荐！直接在页面点启动编译）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup QEMU for multiarch
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux/arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true # 加载到runner本地docker，才能导出tar
          tags: ikiwicc/wiznote:arm64

      - name: Export image to tar.gz
        run: |
          docker save ikiwicc/wiznote:arm64 | gzip > wiznote-arm64.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiznote-arm64-image
          path: wiznote-arm64.tar.gz
